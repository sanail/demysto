<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demysto</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        background: black;
      }
      #frame {
        display: block;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #dim,
      #area {
        position: fixed;
        pointer-events: none;
      }
      #dim {
        inset: 0;
        background: rgb(0 0 0 / 45%);
      }
      /* The shadow dims everything outside the area. */
      #area {
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 45%);
        outline: 1px solid white;
      }
      #size {
        position: fixed;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgb(0 0 0 / 70%);
        color: white;
        font: 12px system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="frame" alt="" />
    <div id="dim"></div>
    <div id="area" hidden></div>
    <div id="size" hidden></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
