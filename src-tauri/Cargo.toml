[package]
name = "demysto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Explain, translate and summarise whatever you are looking at."

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# Cargo requires on Windows. See rust-lang/cargo#8519.
name = "demysto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
demysto-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"

# Wayland claims no Hotkey of its own: it is asked of the desktop's
# GlobalShortcuts portal over D-Bus instead (ADR-0003), and only Linux has one.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }
# Tauri's own async runtime, reached directly for the one thing it does not
# re-export: waiting on the portal and on being told to let go of it at once.
tokio = { version = "1", default-features = false, features = ["macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2", version = "2.0.1" }
