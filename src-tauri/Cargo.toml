[package]
name = "demysto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Explain, translate and summarise whatever you are looking at."

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# Cargo requires on Windows. See rust-lang/cargo#8519.
name = "demysto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
demysto-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
# Without its default features, and the one left out is the point:
# `rustls-tls` pins `rustls` to its `ring` provider, which puts a second crypto
# library in every build beside the `aws-lc-rs` one `reqwest` already carries for
# the Provider requests — and puts `ring`'s ARM64 assembly in the way of a
# Windows build cross-compiled from a Mac. TLS still comes from `reqwest`, whose
# features are shared across this graph.
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = [
    "system-proxy",
    "zip",
] }

# Wayland claims no Hotkey of its own: it is asked of the desktop's
# GlobalShortcuts portal over D-Bus instead (ADR-0003), and only Linux has one.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }
# Tauri's own async runtime, reached directly for the two things it does not
# re-export: waiting on the portal and on being told to let go of it at once,
# and waiting out the pause before the desktop is asked for a Hotkey again.
tokio = { version = "1", default-features = false, features = ["macros", "time"] }
# What the Palette needs to take the keyboard on X11, where an activation is
# judged by the moment it carries and Tauri's `set_focus` carries none. Both at
# the versions Tauri itself builds GTK against, so that the window reached
# through `gtk_window` is the same type this speaks to.
gdkx11 = "0.18"
gtk = "0.18"
# Xlib itself, for the one question neither GDK nor GTK will answer: which
# window the display has the keyboard on. `gdkx11` re-exports the bindings but
# links none of the library, so it is asked for here by name.
x11 = { version = "2", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2", version = "2.0.1" }
