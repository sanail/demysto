[package]
name = "demysto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Explain, translate and summarise whatever you are looking at."

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# Cargo requires on Windows. See rust-lang/cargo#8519.
name = "demysto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
demysto-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
