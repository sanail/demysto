[package]
name = "demysto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Demysto's product logic, independent of any user interface toolkit."

[dependencies]
serde.workspace = true
serde_json = "1"
dirs = "6"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
enigo = "0.6"
toml = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
whatlang = "0.18.0"
toml_edit = "0.25"
fluent = "0.17.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"

[dev-dependencies]
fluent-syntax = "0.12.0"
mockito = "1"
tempfile = "3"
